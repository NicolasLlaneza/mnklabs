name: Deploy

# Publica el sitio en Cloudflare Workers en cada push a main.
# También se puede disparar a mano desde la pestaña Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Falla temprano y con un mensaje claro si falta el token,
      # en vez de morir dentro de wrangler con un exit code pelado.
      - name: Verificar configuración
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Falta el secret CLOUDFLARE_API_TOKEN en Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "Token presente (${#TOKEN} caracteres)"
          echo "Archivos que se van a publicar:"
          find public -type f | sort

      - name: Deploy con wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Necesario: la versión por defecto de la action es anterior a la
          # 3.91, que es cuando wrangler empezó a leer config en JSON/JSONC.
          # Sin esto ignora wrangler.jsonc y pide un entry-point que este
          # sitio no tiene (son archivos estáticos, no un script de Worker).
          wranglerVersion: "4"
